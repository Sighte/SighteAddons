plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
	// Loom adds Fabric + Mojang repos automatically.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No `mappings` line: loom 1.17 defaults to official Mojang mappings for 26.x
	// (Yarn stops at 1.21.11). Class names below are Mojmap, not Yarn.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.flk_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

kotlin {
	// Target 25 (what 26.1.2 requires) without pinning a toolchain, so any JDK >= 25 can build.
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	// BSD-3 requires the notice to accompany redistribution in binary form, and Odin's
	// rooms.json plus the ported core-hash algorithm ship inside this jar.
	from("LICENSE") { rename { "${it}_sighteaddons" } }
	from("LICENSE-Odin")
}

// Keeps the installable jar in the repo, so the checked-in build can never go stale relative to the
// source. The filename carries the mod version, so a jar that has been copied into mods/ still says
// which build it is. Older versions are deleted first: dist/ holds exactly one jar, and git history
// holds the rest.
// Reads the output directory rather than a Loom task, so it does not break when Loom renames its
// tasks - 'remapJar' no longer exists in Loom 1.17.
tasks.register('cleanDist', Delete) {
	delete fileTree('dist') { include 'sighteaddons*.jar' }
}
// Names the one jar this build produced rather than globbing: build/libs keeps the jars of every
// version built before it, and renaming all of them onto one name fails the build outright.
tasks.register('copyToDist', Copy) {
	dependsOn tasks.named('cleanDist')
	from layout.buildDirectory.dir('libs')
	include "${project.archives_base_name}-${project.mod_version}.jar"
	into 'dist'
}
tasks.named('build') { finalizedBy tasks.named('copyToDist') }

test {
	useJUnitPlatform()
}
